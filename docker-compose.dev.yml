services:
  tideline-dev:
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund --prefer-offline && exec npm run dev -- --host"
    ports:
      - '4321:4321'
    environment:
      HOST: '0.0.0.0'
      CHOKIDAR_USEPOLLING: 'true'
      JELLYFIN_URL: ${JELLYFIN_URL}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
    env_file:
      - .env
    volumes:
      - .:/app:Z
      - node_modules:/app/node_modules
      - tideline-data-dev:/data

volumes:
  node_modules:
  tideline-data-dev:
