apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tideline.fullname" . }}
  labels:
    {{- include "tideline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # SQLite on a ReadWriteOnce volume — never run old and new pods side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tideline.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tideline.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: tideline
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4321
              protocol: TCP
          env:
            {{- if .Values.jellyfin.url }}
            - name: JELLYFIN_URL
              value: {{ .Values.jellyfin.url | quote }}
            {{- end }}
            {{- if .Values.jellyfin.internalUrl }}
            - name: JELLYFIN_INTERNAL_URL
              value: {{ .Values.jellyfin.internalUrl | quote }}
            {{- end }}
            {{- if or .Values.jellyfin.existingSecret .Values.jellyfin.apiKey }}
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jellyfin.existingSecret | default (include "tideline.fullname" .) }}
                  key: {{ .Values.jellyfin.existingSecretKey }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "tideline.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
